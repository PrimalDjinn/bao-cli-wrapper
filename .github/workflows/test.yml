name: Test
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n bao-setup-vault.sh
      - run: shellcheck -S warning bao-setup-vault.sh tests/test.sh tests/fake-bao
      - run: bash tests/test.sh
