services:
  db:
    image: postgres:16-alpine
    container_name: openbao-db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # This script runs on first boot to ensure the 'bao' user exists
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  openbao:
    build: .
    container_name: openbao-server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - open_bao_data:${BAO_DATA_DIR:-/bao/data} # Still needed for keys.json backup
    cap_add:
      - IPC_LOCK
    env_file:
      - .env


volumes:
  postgres_data:
  open_bao_data: