services:
  db:
    image: postgres:16-alpine
    container_name: openbao-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      # This script runs on first boot to ensure the 'bao' user exists
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  openbao:
    build: .
    container_name: openbao-server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BAO_THRESHOLD=${BAO_THRESHOLD}
      - BAO_SHARES=${BAO_SHARES}
      - BAO_ADDR=${BAO_ADDR}
    ports:
      - "8200:8200"
    volumes:
      - ./data:/bao/data # Still needed for keys.json backup
    cap_add:
      - IPC_LOCK